services:
  postgres:
    image: postgres:15-alpine
    container_name: nextstopturkey-postgres-dev
    environment:
      POSTGRES_DB: nextstopturkey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tours-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tours-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/nextstopturkey
      JWT_SECRET: dev-jwt-secret-replace-in-production
      PORT: 3001
      FRONTEND_URL: http://localhost:3100
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./prisma:/app/prisma:ro
      - /app/node_modules
    networks:
      - tours-network
    command: sh -c "npx prisma migrate deploy --schema ./prisma/schema.prisma && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tours-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_DATA_MODE: connected
    ports:
      - "3100:3100"
    depends_on:
      - backend
    networks:
      - tours-network

volumes:
  postgres_data:

networks:
  tours-network:
    driver: bridge
